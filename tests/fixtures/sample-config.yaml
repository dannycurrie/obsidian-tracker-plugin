# Small, stable config used by unit tests. Do not change existing ids or
# targets without updating the tests; add new metrics at the end of a goal.
year: 2027
weekStart: monday
timezone: Europe/London
paceTolerance: 0.95
goals:
  - id: career
    name: Career
    statement: Ship things people use
    metrics:
      - id: tengu-wau
        label: Tengu WAU
        kind: weekly
        level: true
        target: 25
        source: { type: manual }
      - id: asl
        label: Non-telephony inbound requests serviced by ASL
        kind: year
        level: true
        target: 100
        unit: "%"
        plan: { type: quarterly, baseline: 0, quarters: [10, 50, 80, 100] }
        source: { type: manual }
  - id: self
    name: Self
    statement: Look after the engine
    metrics:
      - id: meditation
        label: Meditation
        kind: weekly
        target: 100
        unit: min
        source: { type: tracker, metric: "00000000-0000-0000-0000-000000000001", aggregate: sum }
  - id: creative
    name: Creative
    statement: Put more music out into the world
    metrics:
      - id: music-practice
        label: Music practice, playing, recording
        kind: weekly
        target: 60
        unit: min
        source: { type: manual }
      - id: eps
        label: EPs released
        kind: year
        target: 5
        plan: { type: linear }
        paceTolerance: 0.9
        source: { type: manual }
      - id: gigs
        label: Gigs played
        kind: untargeted
        source: { type: manual, cadence: weekly }
